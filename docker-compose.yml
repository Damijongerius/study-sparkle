services:
  frontend:
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3001
    container_name: study-buddy-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      NODE_ENV: production
      VITE_API_URL: http://localhost:3001
    depends_on:
      api:
        condition: service_started

  mongodb:
    image: mongo:7
    container_name: study-buddy-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: studybuddy123
      MONGO_INITDB_DATABASE: studybuddy
    volumes:
      - mongodb_data:/data/db
      - ./backend/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: study-buddy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: study-buddy-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:studybuddy123@mongodb:27017/studybuddy?authSource=admin
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: study-buddy-secret-change-in-production
      PORT: 3001
      OLLAMA_API_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma4:e4b
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongodb_data:
  redis_data:
