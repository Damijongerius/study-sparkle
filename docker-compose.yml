version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: study-buddy-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: studybuddy123
      MONGO_INITDB_DATABASE: studybuddy
    volumes:
      - mongodb_data:/data/db
      - ./backend/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  redis:
    image: redis:7-alpine
    container_name: study-buddy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  api:
    build: ./backend
    container_name: study-buddy-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:studybuddy123@mongodb:27017/studybuddy?authSource=admin
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: study-buddy-secret-change-in-production
      PORT: 3001
    depends_on:
      - mongodb
      - redis

volumes:
  mongodb_data:
  redis_data:
