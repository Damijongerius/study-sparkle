name: Build, verify and publish Docker images

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/damijongerius/study-sparkle:frontend
            ghcr.io/damijongerius/study-sparkle:frontend-${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/damijongerius/study-sparkle:backend
            ghcr.io/damijongerius/study-sparkle:backend-${{ github.sha }}

      - name: Verify with docker compose (optional)
        run: |
          docker compose up -d --build
          sleep 5
          docker compose ps

      - name: Simple smoke test (adjust service name/path as needed)
        run: |
          # replace `web` with your service name if different
          docker compose exec -T web wget -qO- http://localhost || true

      - name: Teardown
        if: always()
        run: docker compose down -v
